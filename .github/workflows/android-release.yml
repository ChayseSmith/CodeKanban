name: Android release

on:
  push:
    branches: ['**']
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 0'
      timezone: America/Denver

permissions:
  contents: write
  id-token: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    # Stable is scheduled only; pushes and manual runs on other branches publish beta.
    if: >-
      github.event_name == 'schedule' ||
      (startsWith(github.ref, 'refs/heads/') &&
       github.ref != format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    env:
      RELEASE_CHANNEL: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'stable' || 'beta' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and sign APK
        shell: bash
        env:
          ANDROID_VERSION_BASE: ${{ vars.ANDROID_VERSION_BASE }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "${ANDROID_VERSION_BASE:-}" =~ ^[0-9]+$ ]]; then
            echo 'Set the repository variable ANDROID_VERSION_BASE to a non-negative integer at least as large as your installed APK version code.' >&2
            exit 1
          fi
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then echo "Missing GitHub Actions secret: $key" >&2; exit 1; fi
          done
          version=$((10#$ANDROID_VERSION_BASE + 10#$GITHUB_RUN_NUMBER))
          if (( version < 1 || version > 2100000000 )); then echo 'Android version code is out of range.' >&2; exit 1; fi
          echo "VERSION_CODE=$version" >> "$GITHUB_ENV"
          keystore="$RUNNER_TEMP/code-kanban-signing.keystore"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod +x android/gradlew
          update_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json"
          (cd android && ./gradlew --no-daemon :app:assembleRelease "-PkanbanVersionCode=$version" "-PkanbanUpdateUrl=$update_url" "-PkanbanReleaseChannel=$RELEASE_CHANNEL")
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          mkdir -p release-output
          "$build_tools/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk release-output/code-kanban.apk
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD release-output/code-kanban.apk
          "$build_tools/apksigner" verify --verbose --print-certs release-output/code-kanban.apk
      - name: Create release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = int(os.environ['VERSION_CODE'])
          repo = os.environ['GITHUB_REPOSITORY']
          apk = Path('release-output/code-kanban.apk')
          manifest = {
              'versionCode': version,
              'channel': os.environ['RELEASE_CHANNEL'],
              'versionName': f'0.1.0 (build {version})',
              'apkUrl': f'https://github.com/{repo}/releases/download/android-{version}/code-kanban.apk',
              'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
          }
          Path('release-output/update.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Set up Node for Firestore rules tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Firestore rules and deployment logic
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/firebase-rules-tests/node_modules
        run: |
          set -euo pipefail
          python3 -m unittest discover -s firebase -p 'test_deploy_rules.py'
          npm install --prefix "$RUNNER_TEMP/firebase-rules-tests" --no-audit --no-fund firebase-tools@15.37.0 firebase@12.19.0 @firebase/rules-unit-testing@5.0.2
          node "$RUNNER_TEMP/firebase-rules-tests/node_modules/firebase-tools/lib/bin/firebase.js" emulators:exec --only firestore --project demo-kanban-sync "node firebase/rules.test.cjs"
      - name: Validate optional Firebase deployment configuration
        id: firebase-config
        shell: bash
        env:
          ENABLED: ${{ vars.FIREBASE_RULES_DEPLOY_ENABLED }}
          PROVIDER: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          project = json.loads(Path('android/app/google-services.json').read_text())['project_info']['project_id']
          enabled = os.environ.get('ENABLED', '').lower()
          if enabled not in ('', 'false', 'true'):
              raise SystemExit('FIREBASE_RULES_DEPLOY_ENABLED must be true or false.')
          if enabled == 'true':
              if not re.fullmatch(r'projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+', os.environ.get('PROVIDER', '')):
                  raise SystemExit('Configure FIREBASE_WORKLOAD_IDENTITY_PROVIDER before enabling deployment.')
              if not os.environ.get('SERVICE_ACCOUNT', '').endswith('@' + project + '.iam.gserviceaccount.com'):
                  raise SystemExit('Configure FIREBASE_DEPLOY_SERVICE_ACCOUNT in the Android Firebase project.')
          else:
              print('Automatic rules deployment is disabled until the one-time Google/GitHub setup is complete.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('project_id=' + project + '\n')
              output.write('enabled=' + ('true' if enabled == 'true' else 'false') + '\n')
          PY
      - name: Authenticate Firebase rules deployer
        if: steps.firebase-config.outputs.enabled == 'true'
        id: firebase-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ steps.firebase-config.outputs.project_id }}
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Deploy Firestore rules before publishing APK
        if: steps.firebase-config.outputs.enabled == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ steps.firebase-config.outputs.project_id }}
          FIREBASE_DEPLOY_ACCESS_TOKEN: ${{ steps.firebase-auth.outputs.access_token }}
        run: python3 firebase/deploy_rules.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-kanban-android
          path: |
            release-output/code-kanban.apk
            release-output/update.json
          if-no-files-found: error
      - name: Publish public GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--latest=false)
          if [[ "$RELEASE_CHANNEL" == stable ]]; then flags=(--latest); else flags+=(--prerelease); fi
          gh release create "android-$VERSION_CODE" release-output/code-kanban.apk release-output/update.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Code Kanban Android build $VERSION_CODE" \
            --notes "Signed Android $RELEASE_CHANNEL build $VERSION_CODE." "${flags[@]}"
          channel_tag="android-$RELEASE_CHANNEL"
          if ! gh release view "$channel_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$channel_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Android $RELEASE_CHANNEL update feed" --notes "Update metadata for the $RELEASE_CHANNEL channel." --prerelease --latest=false
          fi
          gh release upload "$channel_tag" release-output/update.json --repo "$GITHUB_REPOSITORY" --clobber
          # Move channel tags only after the signed APK and feed are published.
          # Keep android-stable for installed apps; android is the public stable alias.
          tags=("$channel_tag")
          if [[ "$RELEASE_CHANNEL" == stable ]]; then tags+=(android); fi
          for tag in "${tags[@]}"; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
                -f sha="$GITHUB_SHA" -F force=true --silent
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --silent
            fi
          done
