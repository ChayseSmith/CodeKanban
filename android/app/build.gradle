plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

def javaString = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.battlemanson.codekanban'
    compileSdk 36
    defaultConfig {
        applicationId 'com.battlemanson.codekanban'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('kanbanVersionCode').getOrElse('1').toInteger()
        versionName '0.1.0'
        buildConfigField 'String', 'DEFAULT_RELEASE_CHANNEL', javaString('stable')
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', javaString(providers.gradleProperty('kanbanUpdateUrl').getOrElse(''))
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
